<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Linerave — API reachability test</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 24px;
        line-height: 1.5;
      }
      pre {
        background: #111;
        color: #eee;
        padding: 16px;
        border-radius: 8px;
        white-space: pre-wrap;
        word-break: break-word;
      }
      button {
        font-size: 16px;
        padding: 8px 16px;
      }
    </style>
  </head>
  <body>
    <h1>API reachability test</h1>
    <p>
      This page runs the same server checks the app runs, one by one, and prints
      exactly what happens. No app code is involved.
    </p>
    <button id="run">Run the checks</button>
    <pre id="out">Press the button…</pre>
    <script>
      const out = document.getElementById("out");
      const log = (line) => {
        out.textContent += line + "\n";
      };

      async function attempt(label, url, init) {
        const started = performance.now();
        try {
          const res = await fetch(url, init);
          const ms = Math.round(performance.now() - started);
          let body = "";
          try {
            body = (await res.text()).slice(0, 120);
          } catch {}
          log(
            `${label}: ANSWERED — http ${res.status}, type ${res.type}, ${ms} ms, body: ${body}`,
          );
        } catch (err) {
          const ms = Math.round(performance.now() - started);
          log(
            `${label}: FAILED — ${err && err.name}: ${err && err.message} (${ms} ms)`,
          );
        }
      }

      document.getElementById("run").addEventListener("click", async () => {
        out.textContent = `origin: ${location.origin}\n`;
        await attempt(
          "1 api health (plain)",
          "https://api.tryliner.fun/health",
        );
        await attempt(
          "2 api health (app's exact recipe)",
          "https://api.tryliner.fun/health",
          {
            cache: "no-store",
            signal: AbortSignal.timeout(6000),
          },
        );
        await attempt(
          "3 api health (no-cors, network only)",
          "https://api.tryliner.fun/health",
          { mode: "no-cors" },
        );
        await attempt("4 covers root", "https://covers.tryliner.fun/");
        log("done");
      });
    </script>
  </body>
</html>
